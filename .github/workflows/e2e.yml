name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Run the E2E suite against a deployed URL instead (tests that write data are skipped)"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, unit, build and E2E
    if: ${{ github.event.inputs.base_url == '' || github.event.inputs.base_url == null }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qa_hub_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway CI database; no real secrets are needed for this job.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qa_hub_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/qa_hub_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qa_hub_test
      E2E_ADMIN_PASSCODE: ci-e2e-passcode
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build (applies migrations)
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  live:
    name: E2E against a deployed URL
    if: ${{ github.event.inputs.base_url != '' && github.event.inputs.base_url != null }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ github.event.inputs.base_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-live
          path: playwright-report
          retention-days: 14
